<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metaball Hero</title>
  <!-- Tailwind CSS for utility styling matching the code -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font: Instrument Serif -->
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" rel="stylesheet">
</head>
<body class="m-0 p-0 bg-[#0a0a0f] text-white">

  <!-- Main Hero Container -->
  <div id="hero-container" class="relative w-full overflow-hidden min-h-screen bg-[#0a0a0f] flex items-center justify-center">
    
    <!-- Metaball Canvas -->
    <canvas id="metaballCanvas" class="absolute inset-0 w-full h-full opacity-85 mix-blend-screen"></canvas>

    <!-- Noise Overlay -->
    <div class="absolute inset-0 w-full h-full pointer-events-none" style="background-image: url(&quot;data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E&quot;); background-repeat: repeat; background-size: 128px 128px;"></div>

    <!-- Content Overlay -->
    <div class="relative z-10 flex items-center justify-center w-full h-full min-h-screen">
      <div class="text-center px-6">
        <h1 class="font-bold tracking-tight leading-none" style="font-family: 'Instrument Serif', serif; font-size: clamp(2.5rem, 8vw, 7.5rem); color: #ffffff; text-shadow: 0 0 80px rgba(0,0,0,0.6); margin: 0; line-height: 1.05;">
          Gobby
        </h1>
        
        <!-- Subtle accent line -->
        <div class="mx-auto mt-8" style="width: 60px; height: 2px; background-image: linear-gradient(90deg, #e63946, #457b9d); border-radius: 1px; opacity: 0.7;"></div>
      </div>
    </div>

    <!-- Vignette -->
    <div class="absolute inset-0 pointer-events-none" style="background-image: radial-gradient(ellipse at center, transparent 40%, rgba(10,10,15,0.7) 100%);"></div>
  </div>

  <script>
    const canvas = document.getElementById('metaballCanvas');
    const container = document.getElementById('hero-container');
    const ctx = canvas.getContext('2d');

    const config = {
      softness: 12,
      colors: ["#e63946", "#457b9d", "#f4a261"].map(hexToRgb)
    };

    function hexToRgb(hex) {
      const h = hex.replace("#", "");
      return [
        parseInt(h.substring(0, 2), 16),
        parseInt(h.substring(2, 4), 16),
        parseInt(h.substring(4, 6), 16),
      ];
    }

    let w = container.clientWidth || 960;
    let h = container.clientHeight || 600;
    
    const balls = [];
    const count = 8;
    for (let i = 0; i < count; i++) {
      const baseR = Math.min(w, h) * 0.08;
      balls.push({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 1.2,
        vy: (Math.random() - 0.5) * 1.2,
        r: baseR + Math.random() * baseR * 1.5,
      });
    }

    const observer = new ResizeObserver(entries => {
      for (let entry of entries) {
        w = Math.floor(entry.contentRect.width);
        h = Math.floor(entry.contentRect.height);
      }
    });
    observer.observe(container);

    const threshold = 1.0;
    const softFactor = config.softness / 10;

    function render() {
      canvas.width = w;
      canvas.height = h;

      // Update positions
      for (const b of balls) {
        b.x += b.vx;
        b.y += b.vy;
        if (b.x - b.r < 0 || b.x + b.r > w) b.vx *= -1;
        if (b.y - b.r < 0 || b.y + b.r > h) b.vy *= -1;
        b.x = Math.max(b.r, Math.min(w - b.r, b.x));
        b.y = Math.max(b.r, Math.min(h - b.r, b.y));
      }

      const imageData = ctx.createImageData(w, h);
      const data = imageData.data;

      const step = 2;
      const sw = Math.ceil(w / step);
      const sh = Math.ceil(h / step);
      const smallBuf = new Float32Array(sw * sh);
      const colorBuf = new Float32Array(sw * sh * 3);

      for (let sy = 0; sy < sh; sy++) {
        const py = sy * step;
        for (let sx = 0; sx < sw; sx++) {
          const px = sx * step;
          let totalField = 0;
          let cr = 0, cg = 0, cb = 0;

          for (let i = 0; i < balls.length; i++) {
            const b = balls[i];
            const dx = px - b.x;
            const dy = py - b.y;
            const distSq = dx * dx + dy * dy;
            const field = (b.r * b.r) / (distSq + 1);
            totalField += field;

            const col = config.colors[i % config.colors.length];
            cr += col[0] * field;
            cg += col[1] * field;
            cb += col[2] * field;
          }

          const idx = sy * sw + sx;
          smallBuf[idx] = totalField;
          if (totalField > 0) {
            colorBuf[idx * 3] = cr / totalField;
            colorBuf[idx * 3 + 1] = cg / totalField;
            colorBuf[idx * 3 + 2] = cb / totalField;
          }
        }
      }

      for (let y = 0; y < h; y++) {
        const sy = Math.min(Math.floor(y / step), sh - 1);
        for (let x = 0; x < w; x++) {
          const sx = Math.min(Math.floor(x / step), sw - 1);
          const idx = sy * sw + sx;
          const field = smallBuf[idx];

          let alpha = softFactor > 0.5 
            ? Math.min(1, Math.max(0, (field - threshold * 0.3) / (threshold * softFactor)))
            : (field >= threshold ? 1 : Math.max(0, (field - threshold * 0.5) / (threshold * 0.5)));

          if (alpha > 0.01) {
            const pi = (y * w + x) * 4;
            const r = colorBuf[idx * 3];
            const g = colorBuf[idx * 3 + 1];
            const b = colorBuf[idx * 3 + 2];

            const brightness = Math.min(1.3, 0.85 + field * 0.15);
            data[pi]     = Math.min(255, r * brightness);
            data[pi + 1] = Math.min(255, g * brightness);
            data[pi + 2] = Math.min(255, b * brightness);
            data[pi + 3] = Math.min(255, alpha * 255);
          }
        }
      }

      ctx.putImageData(imageData, 0, 0);
      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
